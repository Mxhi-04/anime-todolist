<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="viviBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c2d48" />
      <stop offset="65%" stop-color="#061c30" />
      <stop offset="100%" stop-color="#030c14" />
    </radialGradient>

    <!-- Alabasta Royal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="40%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#e09f3e" />
    </linearGradient>

    <!-- Vivi Vibrant Royal Blue Hair Gradient -->
    <linearGradient id="viviHairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70e000" stop-opacity="0" />
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Peacock Turquoise Gradient -->
    <linearGradient id="peacockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06d6a0" />
      <stop offset="60%" stop-color="#118ab2" />
      <stop offset="100%" stop-color="#073b4c" />
    </linearGradient>

    <!-- Bone Gradient -->
    <linearGradient id="viviBoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Badge Base -->
  <circle cx="128" cy="128" r="120" fill="url(#viviBgGlow)" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="128" cy="128" r="114" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />

  <!-- Alabasta 8-Point Sun Crest Rays in background -->
  <g opacity="0.4" filter="url(#royalGlow)">
    <g transform="translate(128, 128)">
      <polygon points="0,-106 12,-40 0,-30 -12,-40" fill="url(#goldGrad)" />
      <polygon points="0,106 12,40 0,30 -12,40" fill="url(#goldGrad)" />
      <polygon points="-106,0 -40,12 -30,0 -40,-12" fill="url(#goldGrad)" />
      <polygon points="106,0 40,12 30,0 40,-12" fill="url(#goldGrad)" />
      <polygon points="-75,-75 -20,-36 -21,-21 -36,-20" fill="url(#goldGrad)" />
      <polygon points="75,75 20,36 21,21 36,20" fill="url(#goldGrad)" />
      <polygon points="75,-75 36,-20 21,-21 20,-36" fill="url(#goldGrad)" />
      <polygon points="-75,75 -36,20 -21,21 -20,36" fill="url(#goldGrad)" />
      <!-- Central Ring -->
      <circle cx="0" cy="0" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    </g>
  </g>

  <!-- Crossed Bones with Peacock Feathers / Slasher Ribbons -->
  <g fill="url(#viviBoneGrad)" stroke="#64748b" stroke-width="1.5">
    <!-- Bone 1: Top-Left to Bottom-Right -->
    <g transform="rotate(45 128 128)">
      <circle cx="28" cy="120" r="12" />
      <circle cx="28" cy="136" r="12" />
      <circle cx="228" cy="120" r="12" />
      <circle cx="228" cy="136" r="12" />
      <rect x="28" y="122" width="200" height="12" rx="3" />
    </g>
    <!-- Bone 2: Bottom-Left to Top-Right -->
    <g transform="rotate(-45 128 128)">
      <circle cx="28" cy="120" r="12" />
      <circle cx="28" cy="136" r="12" />
      <circle cx="228" cy="120" r="12" />
      <circle cx="228" cy="136" r="12" />
      <rect x="28" y="122" width="200" height="12" rx="3" />
    </g>
  </g>

  <!-- Peacock Slasher Jewel Eyes on Bone Ends -->
  <g>
    <circle cx="56" cy="56" r="6" fill="url(#peacockGrad)" stroke="#ffd166" stroke-width="1.5" />
    <circle cx="200" cy="56" r="6" fill="url(#peacockGrad)" stroke="#ffd166" stroke-width="1.5" />
    <circle cx="56" cy="200" r="6" fill="url(#peacockGrad)" stroke="#ffd166" stroke-width="1.5" />
    <circle cx="200" cy="200" r="6" fill="url(#peacockGrad)" stroke="#ffd166" stroke-width="1.5" />
  </g>

  <!-- Flowing Royal Blue Hair Strands behind Skull -->
  <g fill="url(#viviHairGrad)" opacity="0.95">
    <!-- Left curls -->
    <path d="M 90 100 C 60 110 50 150 55 175 C 60 190 70 195 72 185 C 66 165 72 135 94 125 Z" />
    <!-- Right ponytail / curls -->
    <path d="M 166 100 C 196 110 206 150 201 175 C 196 190 186 195 184 185 C 190 165 184 135 162 125 Z" />
    <!-- Top Hair Bun / Swirl -->
    <path d="M 110 65 C 110 40 146 40 146 65 Z" />
  </g>

  <!-- Skull Base -->
  <g>
    <!-- Skull Cranium -->
    <path d="M 88 138 C 80 106 92 84 128 84 C 164 84 176 106 168 138 C 165 150 155 156 152 164 C 148 174 142 176 128 176 C 114 176 108 174 104 164 C 101 156 91 150 88 138 Z" fill="#ffffff" stroke="#334155" stroke-width="2.5" />
    <!-- Jaw / Teeth Box -->
    <path d="M 108 164 L 148 164 L 144 180 C 144 184 140 186 128 186 C 116 186 112 184 112 180 Z" fill="#f8fafc" stroke="#334155" stroke-width="2" />
    <!-- Teeth divider lines -->
    <line x1="120" y1="164" x2="120" y2="183" stroke="#475569" stroke-width="2" />
    <line x1="128" y1="164" x2="128" y2="185" stroke="#475569" stroke-width="2" />
    <line x1="136" y1="164" x2="136" y2="183" stroke="#475569" stroke-width="2" />

    <!-- Big Anime Skull Eyes -->
    <ellipse cx="112" cy="134" rx="12" ry="14" fill="#0f172a" />
    <ellipse cx="144" cy="134" rx="12" ry="14" fill="#0f172a" />
    <!-- Cute Blue Star Eye Glints -->
    <circle cx="114" cy="130" r="4" fill="#38bdf8" />
    <circle cx="146" cy="130" r="4" fill="#38bdf8" />
    <circle cx="115" cy="129" r="1.5" fill="#ffffff" />
    <circle cx="147" cy="129" r="1.5" fill="#ffffff" />

    <!-- Cute Heart Nose -->
    <path d="M 128 146 C 124 142 122 146 125 152 L 128 156 L 131 152 C 134 146 132 142 128 146 Z" fill="#0f172a" />
  </g>

  <!-- The Iconic Straw Hat "X" Friendship Mark on Skull Forehead -->
  <g transform="translate(128, 110)">
    <!-- White Bandage Patch -->
    <rect x="-14" y="-14" width="28" height="28" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" />
    <!-- Bold Black "X" of Friendship -->
    <line x1="-9" y1="-9" x2="9" y2="9" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />
    <line x1="9" y1="-9" x2="-9" y2="9" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Princess Vivi's Golden Royal Alabasta Crown / Tiara -->
  <g>
    <!-- Crown Base Band -->
    <path d="M 98 84 C 114 80 142 80 158 84 L 156 80 C 142 76 114 76 100 80 Z" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1" />
    <!-- Crown Peaks -->
    <polygon points="100,80 106,62 116,74 128,52 140,74 150,62 156,80" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5" />
    <!-- Royal Jewels on Crown Peaks -->
    <circle cx="106" cy="62" r="3" fill="#06d6a0" stroke="#065f46" stroke-width="0.8" />
    <circle cx="128" cy="52" r="4.5" fill="#ef233c" stroke="#881337" stroke-width="1" />
    <circle cx="150" cy="62" r="3" fill="#06d6a0" stroke="#065f46" stroke-width="0.8" />
    <!-- Center Lotus Diamond -->
    <polygon points="128,68 132,73 128,78 124,73" fill="#38bdf8" />
  </g>

  <!-- Alabasta Friendship Ribbon Banner below -->
  <g transform="translate(128, 230)">
    <rect x="-56" y="-12" width="112" height="20" rx="10" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="1.5" />
    <text x="0" y="2" font-family="'Impact', 'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#ffd166" text-anchor="middle" letter-spacing="1.5">NEFELTARI VIVI</text>
  </g>
</svg>
